name: BenefitFlow coordination hardening

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run BenefitFlow product and hardening tests
        run: python -m pytest -q

      - name: Run retained framework reference tests
        run: python framework_reference/tests/run_all.py

      - name: Build synchronized role packages from exact SHA
        run: python tools/build_agent_packages.py --source-revision "$GITHUB_SHA"

      - name: Verify synchronized role packages
        run: python tools/verify_agent_packages.py --source-revision "$GITHUB_SHA"

      - name: Publish role deployment release set
        uses: actions/upload-artifact@v4
        with:
          name: benefitflow-agent-packages-${{ github.sha }}
          path: |
            dist/benefitflow-primary-agent-v0.4.0-beta.1.zip
            dist/benefitflow-manager-agent-v0.4.0-beta.1.zip
            dist/benefitflow-research-agent-v0.4.0-beta.1.zip
            dist/RELEASE_SET.json
          if-no-files-found: error
